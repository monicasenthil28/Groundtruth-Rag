[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth-rag"
version = "0.1.0"
description = "Reusable RAG retrieval evaluation and regression contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
benchmark = ["numpy>=1.26", "pandas>=2", "pyyaml>=6", "scikit-learn>=1.4", "sentence-transformers>=3", "rank-bm25>=0.2", "pypdf>=4", "jinja2>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
groundtruth = "groundtruth_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
