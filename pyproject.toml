[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth-rag"
version = "0.1.0"
description = "RAG retrieval evaluation and regression platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "rich>=13,<15", "numpy>=1.26", "pyyaml>=6", "rank-bm25>=0.2", "pypdf>=4"]

[project.optional-dependencies]
models = ["sentence-transformers>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
groundtruth = "groundtruth_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
